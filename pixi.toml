[workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
python = ">=3.12,<3.13"
pydantic = ">=2"
paho-mqtt = ">=2.0"

[pypi-dependencies]
commlib-py = ">=0.13.2,<0.14"
aiomqtt = ">=2.0"

[feature.dev.dependencies]
pytest = ">=9.0.3"
pytest-asyncio = ">=0.21.0"
pytest-cov = ">=7.1.0"
pytest-timeout = ">=2.2.0"
ruff = ">=0.15.10"
mypy = ">=1.5.1"
pre-commit = ">=2.15.0"

[feature.ci.dependencies]
ruff = ">=0.15.10"
mypy = ">=1.5.1"
pytest = ">=9.0.3"
pytest-cov = ">=7.1.0"
pytest-timeout = ">=2.2.0"
bandit = ">=1.8.0"
pre-commit = ">=2.15.0"
hatchling = ">=1.18"

[feature.py312.dependencies]
python = "3.12.*"

[environments]
default = { features = ["dev"], solve-group = "default" }
ci = { features = ["ci", "dev"], solve-group = "default" }
quality-ci = { features = ["ci", "dev"], solve-group = "default" }
py312 = { features = ["py312", "dev"], solve-group = "py312" }

[tasks]
test = "pytest tests/"
test-unit = "pytest tests/unit/"
test-integration = "pytest tests/integration/"
lint = "ruff check remote_iface tests"
format = "ruff format remote_iface tests"
format-check = "ruff format --check remote_iface tests"
typecheck = "mypy remote_iface"
build = "hatchling build"
check-commlib-isolation = "bash scripts/check_commlib_isolation.sh"
quality = { depends-on = ["lint", "format-check"] }
coverage = "pytest tests/ --cov=remote_iface --cov-report=term-missing"
check = { depends-on = ["check-commlib-isolation", "quality", "typecheck", "test"] }
