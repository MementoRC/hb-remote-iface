[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "hb-remote-iface"
dynamic = ["version"]
description = "MQTT/RPC remote interface layer for hummingbot — drop-in replacement for hummingbot.remote_iface.*"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
    "pydantic>=2",
    "commlib-py>=0.13.2,<0.14",
    "paho-mqtt>=1.6.1,<2.0",
    "aiomqtt>=2.0",
    "hb-event-bus @ git+https://github.com/MementoRC/hb-event-bus.git@7e2538f21af739c119dd44f3934a8dc48586254c",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "remote_iface/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["remote_iface"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.12,<3.13"
pydantic = ">=2"
paho-mqtt = ">=1.6.1,<2.0"
commlib-py = ">=0.13.2,<0.14"

[tool.pixi.feature.dev.dependencies]
pytest = ">=9.0.3"
pytest-asyncio = ">=0.21.0"
pytest-cov = ">=7.1.0"
pytest-timeout = ">=2.2.0"
ruff = "=0.15.10"
mypy = ">=1.5.1"
pre-commit = ">=2.15.0"

[tool.pixi.feature.ci.dependencies]
ruff = "=0.15.10"
mypy = ">=1.5.1"
pytest = ">=9.0.3"
pytest-cov = ">=7.1.0"
pytest-timeout = ">=2.2.0"
bandit = ">=1.8.0"
pre-commit = ">=2.15.0"
hatchling = ">=1.18"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
ci = { features = ["ci", "dev"], solve-group = "default" }
quality-ci = { features = ["ci", "dev"], solve-group = "default" }
py312 = { features = ["py312", "dev"], solve-group = "py312" }

[tool.pixi.tasks]
test = "pytest tests/"
test-unit = "pytest tests/unit/"
test-integration = "pytest tests/integration/"
lint = "ruff check remote_iface tests"
format = "ruff format remote_iface tests"
format-check = "ruff format --check remote_iface tests"
typecheck = "mypy remote_iface"
build = "hatchling build"
check-commlib-isolation = "bash scripts/check_commlib_isolation.sh"
quality = { depends-on = ["lint", "format-check"] }
coverage = "pytest tests/ --cov=remote_iface --cov-report=term-missing"
check = { depends-on = ["check-commlib-isolation", "quality", "typecheck", "test"] }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
markers = [
    "unit: unit tests",
    "integration: integration tests",
]
timeout = 30
addopts = "--strict-markers --strict-config -v"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N", "SIM", "TCH"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
# Bare dict/list/Callable annotations (without type args) exist throughout Stage 1-3 code.
# Suppress [type-arg] globally; a dedicated annotation cleanup pass will follow
# once the Python 3.12 baseline transition is done.
disable_error_code = ["type-arg"]

[tool.coverage.run]
branch = true
source_pkgs = ["remote_iface"]
omit = ["remote_iface/__about__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = ["no cov", "if __name__", "if TYPE_CHECKING", "raise NotImplementedError", "@overload"]

[tool.hummingbot.supersedes]
module = "hummingbot.remote_iface"
import_path = "remote_iface"
test_paths = ["test/hummingbot/remote_iface"]
