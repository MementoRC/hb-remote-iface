[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "hb-remote-iface"
dynamic = ["version"]
description = "MQTT/RPC remote interface layer for hummingbot — drop-in replacement for hummingbot.remote_iface.*"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.10",
    "mypy>=1.20.0",
]

[tool.hatch.version]
path = "remote_iface/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["remote_iface"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
markers = [
    "unit: unit tests",
    "integration: integration tests",
]
timeout = 30
addopts = "--strict-markers --strict-config -v"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N", "SIM", "TCH"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
# Bare dict/list/Callable annotations (without type args) exist throughout Stage 1-3 code.
# Suppress [type-arg] globally; a dedicated annotation cleanup pass will follow
# once the Python 3.12 baseline transition is done.
disable_error_code = ["type-arg"]

[tool.coverage.run]
branch = true
source_pkgs = ["remote_iface"]
omit = ["remote_iface/__about__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = ["no cov", "if __name__", "if TYPE_CHECKING", "raise NotImplementedError", "@overload"]

[tool.hummingbot.supersedes]
module = "hummingbot.remote_iface"
import_path = "remote_iface"
test_paths = ["test/hummingbot/remote_iface"]
